<section class="marques">

  <div class="marques-container">

    <h2 class="marques-title">
      Nos Partenaires
    </h2>

    <p-carousel
      class="marques-carousel"
      align="center"
      [slidesPerPage]="slidesPerPage">

      <p-carousel-content>

        @for (logo of logos; track logo.id) {

          <p-carousel-item>

            <div class="marque-card">

              <img
                [src]="logo.url"
                [alt]="logo.name"
                class="marque-logo">

            </div>

          </p-carousel-item>

        }

      </p-carousel-content>

      <div class="marques-controls">

        <button
          pCarouselPrev
          type="button"
          class="marque-button"
          aria-label="Marque précédente">

          <svg
            class="marque-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none">

            <path
              d="m14 8-4 4 4 4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>

          </svg>

        </button>

        <button
          pCarouselNext
          type="button"
          class="marque-button"
          aria-label="Marque suivante">

          <svg
            class="marque-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none">

            <path
              d="m10 16 4-4-4-4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>

          </svg>

        </button>

      </div>

    </p-carousel>

  </div>

</section>
