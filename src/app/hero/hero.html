<section class="hero">
  <!-- PARTIE HAUTE -->
  <div class="hero-container">

    <div class="hero-content">
      <h1 class="hero-title">
        Découvrez <br> Mada-Stock<br>
      </h1>

      <p class="hero-description">
        Votre boutique spécialisée en e&#8209;cigarettes et e&#8209;liquides, pensée pour vous offrir une vape riche en saveurs et adaptée à tous les profils.      </p>

    </div>

    <section class="carousel">
      <div
        class="carousel-track"
        [style.transform]="'translateX(-' + currentSlide * 100 + '%)'"
      >
        <div class="carousel-slide" *ngFor="let image of images">
          <img [src]="image" alt="Image carousel">
        </div>
      </div>
    
      <!-- Boutons -->
      <button class="carousel-btn prev" (click)="previousSlide()">
        &#10094;
      </button>
    
      <button class="carousel-btn next" (click)="nextSlide()">
        &#10095;
      </button>
    
      <!-- Indicateurs -->
      <div class="carousel-dots">
        <span
          *ngFor="let image of images; let i = index"
          [class.active]="i === currentSlide"
          (click)="goToSlide(i)"
        ></span>
      </div>
    </section>  </div>
</section>
