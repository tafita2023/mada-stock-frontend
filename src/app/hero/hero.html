<section class="hero">
  <!-- PARTIE HAUTE -->
  <div class="hero-container">

    <div class="hero-content">
      <h1 class="hero-title">
        Découvrez <br> Mada-Stock<br>
      </h1>

      <p class="hero-description">
        Votre boutique spécialisée en e&#8209;cigarettes et e&#8209;liquides, pensée pour vous offrir une vape riche en saveurs et adaptée à tous les profils.      </p>

    </div>

    <section class="carousel">
      <div class="carousel-container">
    
        <p-carousel
          class="carousel-component"
          align="center"
          [loop]="true">
        
          <p-carousel-content class="carousel-content">
    
            @for (item of items; track item) {
    
              <p-carousel-item>
    
                <div class="carousel-slide">
                  <span>{{ item }}</span>
                </div>
    
              </p-carousel-item>
    
            }
    
          </p-carousel-content>
    
          <div class="carousel-controls">
    
            <button
              pCarouselPrev
              class="carousel-button carousel-button-prev"
              type="button"
              aria-label="Slide précédente">
    
              <svg
                class="carousel-icon"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24">
    
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m14 8-4 4 4 4"/>
              </svg>
    
            </button>
    
            <button
              #nextButton
              pCarouselNext
              class="carousel-button carousel-button-next"
              type="button"
              aria-label="Slide suivante">
    
              <svg
                class="carousel-icon"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24">
    
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m10 16 4-4-4-4"/>
              </svg>
    
            </button>
    
          </div>

          <div class="carousel-indicators">
            <p-carousel-indicators></p-carousel-indicators>
          </div>
    
        </p-carousel>
    
      </div>
    </section>
    </div>
</section>
