<div class="welcome-overlay" *ngIf="showWelcomePopup">
    <div class="welcome-popup">
      <div class="img">
        <img src="/Fille.png" alt="Image" class="hero-img">
      </div>
    
      <p>J'ai plus de 18 ans</p>
      <div class="buttons">
        <button class="yes" (click)="accept()">Oui</button>
        <button class="no" (click)="decline()">Non</button>
      </div>
    </div>
  </div>
