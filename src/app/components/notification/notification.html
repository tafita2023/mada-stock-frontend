<div class="messages-container">

    <div class="messages-header">
      <h2>Messages reçus</h2>
    </div>
  
    <div class="messages-list">
  
      <div 
        class="message-card" 
        *ngFor="let message of messages"
        (click)="openMessage(message)"
      >
  
        <div class="message-info">
          <h3>{{ message.nom }}</h3>
          <span>{{ message.email }}</span>
        </div>
  
        <div class="message-preview">
          {{ message.message | slice:0:80 }}...
        </div>
  
        <div class="message-date">
          {{ message.created_at | date:'dd/MM/yyyy HH:mm' }}
        </div>
  
        <button
            class="delete-btn"
            (click)="deleteMessage(message.id); $event.stopPropagation()">
            Supprimer
        </button>
        
      </div>
  
    </div>
  
  </div>
  
  
  <!-- Popup détail message -->
  <div class="modal-overlay" *ngIf="selectedMessage">
  
    <div class="message-modal">
  
      <button 
        class="close-btn"
        (click)="closeMessage()">
        ×
      </button>
  
      <h2>{{ selectedMessage.nom }}</h2>
  
      <p class="email">
        {{ selectedMessage.email }}
      </p>
  
      <div class="message-content">
        {{ selectedMessage.message }}
      </div>
  
      <div class="modal-date">
        Reçu le :
        {{ selectedMessage.created_at | date:'dd/MM/yyyy HH:mm' }}
      </div>
  
    </div>
  
  </div>
